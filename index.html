<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-visual`: the on-screen KEYBOARD must not
         resize the layout viewport. The board is sized from `100dvh` minus a
         fixed HUD reserve, so under the default `resizes-content` every
         keyboard open shrank `dvh` by the keyboard's height and the board
         collapsed with it — measured at a 510px viewport the 363px board
         became 39x39 with 7px slots, i.e. the match became unplayable the
         moment anyone tapped the chat input. Reported from the device as
         "tried chat in battle and it broke the game".
         With this, the keyboard overlays the visual viewport and the layout
         underneath is left alone. `styles.css` also floors `--board-size`, so
         a browser that ignores this hint still cannot collapse the board. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />
    <title>War Element — Alpha</title>
    <!-- Install to home screen → runs fullscreen (no browser URL bar). Orientation
         is unlocked ("any") so the deck builder can be used in landscape for more room. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#050509" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="War Element" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter Tight joins the SAME request rather than adding a second one. The
         redesign's type scale puts it under 14px everywhere Cinzel used to go:
         Cinzel is a display serif whose lowercase is small for its em, so an
         11px tile numeral in it is the reason board names truncated. Cinzel
         still owns fs-6 and up. If this request fails the CSS falls back to
         Alegreya Sans, which is what the app shipped with. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Inter+Tight:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- THE BOOT SPLASH. Until now `#root` was empty until React mounted, so the
         first thing a cold visit showed was a blank dark page for however long
         the module graph and the webfont took — on a phone on mobile data that
         is the whole first impression, and it looks like nothing is happening.

         Plain markup with its own inline CSS ON PURPOSE: it has to paint before
         styles.css and before any JavaScript arrives, so it can afford neither
         an extra request nor a class from the bundle. The wordmark is TEXT
         rather than /title.webp for the same reason — an image here would be one
         more thing to wait for, on the screen whose entire job is to fill the
         wait. Cinzel is requested above; the stack falls back to a system serif,
         which is a fine thing to see for the half-second before it swaps.

         `main.tsx` removes this from a mount effect, i.e. after React has
         actually committed. If the bundle never arrives it stays up, which is
         still better than a blank page: the title is on screen and the mark
         with it. -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #050509; color: #cfc7b8;
        font-family: Cinzel, Georgia, "Times New Roman", serif;
        text-align: center; padding: 24px;
      }
      #boot .boot-mark {
        font-size: clamp(28px, 9vw, 56px); font-weight: 700;
        letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.1;
        background: linear-gradient(180deg, #f0d99a, #c9a24b 62%, #8a6a28);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      #boot .boot-legal {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        color: #6b6558; font-family: Georgia, "Times New Roman", serif;
      }
      /* The one moving part, so the screen reads as working rather than stuck. */
      #boot .boot-bar {
        width: min(180px, 50vw); height: 2px; border-radius: 2px;
        background: rgba(201, 162, 75, 0.18); overflow: hidden;
      }
      #boot .boot-bar i { display: block; width: 40%; height: 100%; background: #c9a24b;
        animation: bootSlide 1.1s ease-in-out infinite; }
      @keyframes bootSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-bar i { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
    <div id="boot">
      <div class="boot-mark">War&nbsp;Element</div>
      <div class="boot-bar" aria-hidden="true"><i></i></div>
      <div class="boot-legal">War Element™ &middot; 2026 &middot; Bernard</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
